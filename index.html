<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miki Market</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Telegram Web App Script (if needed) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Utility to hide scrollbars for horizontal categories */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="w-full min-h-screen bg-slate-900 text-white font-sans">

  <!-- MAIN CONTAINER -->
  <main class="w-full px-3 pb-24">

    <!-- HEADER -->
    <div class="flex justify-between items-center py-4">
      <h1 class="text-xl font-bold text-blue-400">
        🛒 Miki Market
      </h1>
      <button
        id="open-modal-btn"
        class="w-10 h-10 bg-blue-500 rounded-full text-xl flex items-center justify-center active:scale-95 transition-transform"
      >
        +
      </button>
    </div>

    <!-- CATEGORIES -->
    <div id="categories-container" class="flex gap-2 overflow-x-auto mb-4 scrollbar-hide">
      <!-- Generated by JavaScript -->
    </div>

    <!-- PRODUCTS GRID -->
    <div id="products-grid" class="grid grid-cols-2 gap-3 items-start">
      <!-- Generated by JavaScript -->
    </div>

    <!-- EMPTY STATE -->
    <p id="empty-state" class="text-center text-slate-400 mt-10 text-sm hidden">
      No products found
    </p>

  </main>

  <!-- ADD PRODUCT MODAL -->
  <div id="add-product-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <!-- Close Area Backplate -->
    <div id="modal-overlay" class="absolute inset-0"></div>

    <!-- Modal Card -->
    <div class="relative bg-slate-800 w-full max-w-sm p-5 rounded-2xl border border-slate-700 z-10">
      <h2 class="font-bold text-lg mb-4">Add Product</h2>
      <div class="bg-slate-900 p-4 rounded-xl text-xs text-slate-400 mb-4">
        Product form coming soon...
      </div>
      <button
        id="close-modal-btn"
        class="w-full bg-slate-700 py-3 rounded-xl font-medium active:scale-95 transition-transform"
      >
        Close
      </button>
    </div>
  </div>

  <!-- JAVASCRIPT STATE LOGIC -->
  <script>
    // 1. Data Definitions
    const categories = ["All", "Phones", "Laptops", "Shoes"];

    const products = [
      {
        id: 1,
        title: "iPhone 13",
        price: "45000 ETB",
        category: "Phones",
        available: true,
        description: "Powerful Apple smartphone with excellent camera quality.",
        specs: {
          storage: "128GB",
          ram: "4GB",
          battery: "3240 mAh",
          display: "6.1 inch OLED",
        },
        image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=800",
      },
      {
        id: 2,
        title: "Gaming Laptop",
        price: "85000 ETB",
        category: "Laptops",
        available: false,
        description: "High performance laptop for gaming and editing.",
        specs: {
          cpu: "Intel i7",
          ram: "16GB",
          storage: "512GB SSD",
          gpu: "RTX 3060",
        },
        image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?q=80&w=800",
      },
      {
        id: 3,
        title: "Nike Air",
        price: "6500 ETB",
        category: "Shoes",
        available: true,
        description: "Comfortable and stylish everyday sneakers.",
        specs: {
          brand: "Nike",
          size: "42",
          color: "Black",
          material: "Mesh",
        },
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=800",
      },
      {
        id: 4,
        title: "MacBook Pro",
        price: "120000 ETB",
        category: "Laptops",
        available: true,
        description: "Apple laptop for developers and creators.",
        specs: {
          cpu: "M2 Chip",
          ram: "16GB",
          storage: "1TB SSD",
          display: "14 inch Retina",
        },
        image: "https://images.unsplash.com/photo-1517336714739-489689fd1ca8?q=80&w=800",
      },
    ];

    // 2. Dynamic Component State Variables
    let selectedCategory = "All";
    let openId = null;

    // 3. Initialize Telegram WebApp (mimicking your useEffect)
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.expand();
    }

    // 4. Render Categories Row
    function renderCategories() {
      const container = document.getElementById("categories-container");
      container.innerHTML = categories.map(cat => {
        const isActive = selectedCategory === cat;
        const classes = isActive 
          ? "bg-blue-500 text-white" 
          : "bg-slate-800 text-slate-300";
        return `
          <button 
            onclick="setCategory('${cat}')" 
            class="flex-shrink-0 px-4 py-2 rounded-full text-sm transition-all ${classes}"
          >
            ${cat}
          </button>
        `;
      }).join("");
    }

    // 5. Render Products Grid
    function renderProducts() {
      const grid = document.getElementById("products-grid");
      const emptyState = document.getElementById("empty-state");

      // Filter Logic
      const filteredProducts = selectedCategory === "All" 
        ? products 
        : products.filter(p => p.category === selectedCategory);

      // Handle Empty States
      if (filteredProducts.length === 0) {
        emptyState.classList.remove("hidden");
        grid.innerHTML = "";
        return;
      } else {
        emptyState.classList.add("hidden");
      }

      // Build out product elements
      grid.innerHTML = filteredProducts.map(product => {
        const isOpen = openId === product.id;
        const borderClass = isOpen ? "border-blue-500" : "border-slate-700";
        
        // Generate Dynamic Specs List
        let specsHtml = "";
        for (const [key, value] of Object.entries(product.specs)) {
          specsHtml += `
            <div class="flex justify-between gap-2 text-[10px]">
              <span class="text-slate-400 capitalize">${key}</span>
              <span class="text-right">${value}</span>
            </div>
          `;
        }

        return `
          <div class="w-full min-w-0 bg-slate-800 rounded-2xl overflow-hidden border transition-all duration-300 ${borderClass}">
            
            <!-- CARD HEADER & COVER -->
            <div onclick="toggleProductDetail(${product.id})" class="cursor-pointer">
              <img src="${product.image}" alt="${product.title}" class="w-full h-24 object-cover" />
              <div class="p-2.5">
                <h2 class="font-semibold text-sm truncate">${product.title}</h2>
                <p class="text-sky-400 font-bold text-sm mt-1">${product.price}</p>
                <p class="text-[11px] opacity-60 mt-1">
                  ${product.available ? "● Available" : "● Out of stock"}
                </p>
              </div>
            </div>

            <!-- EXPANDED DETAILS ACCORDION -->
            <div class="transition-all duration-300 overflow-hidden ${isOpen ? 'max-h-[500px] opacity-100 p-2.5 pt-0' : 'max-h-0 opacity-0'}">
              <div class="border-t border-slate-700 pt-3">
                
                <!-- Description -->
                <p class="text-[11px] text-slate-400 leading-relaxed mb-3">${product.description}</p>
                
                <!-- Specs Panel -->
                <div class="bg-slate-900 p-2 rounded-xl mb-3">
                  <h3 class="text-[10px] uppercase text-slate-500 mb-2">Specs</h3>
                  <div class="space-y-1">${specsHtml}</div>
                </div>

                <!-- Action CTA Buttons -->
                <div class="grid grid-cols-1 gap-2">
                  <button 
                    class="w-full py-2 rounded-xl font-bold text-[11px] transition-all active:scale-95 ${product.available ? 'bg-emerald-500 text-white' : 'bg-slate-700 text-slate-500'}"
                    ${!product.available ? 'disabled' : ''}
                  >
                    Is this available?
                  </button>
                  <button class="w-full bg-blue-500 py-2 rounded-xl font-bold text-[11px] transition-all active:scale-95">
                    Contact Seller
                  </button>
                </div>

              </div>
            </div>

          </div>
        `;
      }).join("");
    }

    // 6. Interactive State Mutator Functions
    function setCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderProducts();
    }

    function toggleProductDetail(id) {
      openId = (openId === id) ? null : id;
      renderProducts();
    }

    // 7. Modal Control Logic
    const modal = document.getElementById("add-product-modal");
    
    document.getElementById("open-modal-btn").addEventListener("click", () => {
      modal.classList.remove("hidden");
    });

    const closeModal = () => modal.classList.add("hidden");
    document.getElementById("close-modal-btn").addEventListener("click", closeModal);
    document.getElementById("modal-overlay").addEventListener("click", closeModal);

    // Initial Core Application Bootstrapping
    renderCategories();
    renderProducts();
  </script>
</body>
</html>
